name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'ethanol/frontend/package-lock.json'

      - name: Install dependencies
        run: cd ethanol/frontend && npm install

      - name: Build frontend
        run: cd ethanol/frontend && npm run build
        env:
          VITE_STANDALONE: 'true'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'ethanol/frontend/dist'

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
